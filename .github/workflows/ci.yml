name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install packages
        run: npm ci

      - name: Build
        run: npm run build

      # No need to have the generated content up-to-date, but its content must be complete
      - name: Verify documentation content
        run: npm run docs:update

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test:coverage -- --ci

  # The repository is linted with the latest ESLint, but the rule must work with all supported versions
  eslint-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eslint-version: [8, 9, 10]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install packages
        run: npm ci

      - name: Install ESLint v${{ matrix.eslint-version }}
        run: npm install --no-save --legacy-peer-deps eslint@^${{ matrix.eslint-version }}

      - name: Tests
        run: npm run test -- --ci
